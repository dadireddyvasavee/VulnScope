[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vulnscope-code-security"
version = "0.1.0"
description = "AI-assisted static application security testing for Python with taint tracking"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "numpy>=1.24", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2",
  "python-multipart>=0.0.9", "sqlalchemy>=2.0"]
[project.optional-dependencies]
external = ["bandit>=1.7", "semgrep>=1.50"]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7", "httpx>=0.27"]
[project.scripts]
vulnscope = "vulnscope.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
